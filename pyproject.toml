[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulate-ca-imaging-video"
version = "0.1.0"
description = "Python port of the Simulate_Ca_Imaging_video MATLAB repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py",
  "imageio",
  "imageio-ffmpeg",
  "matplotlib",
  "numpy",
  "scipy",
  "scikit-image",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "jupyter",
  "matlabengine",
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
